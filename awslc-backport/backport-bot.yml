# AWS-LC backport bot (post-merge automation).
#
# Trigger:  a PR is merged that carries the `needs-backport` label.
# Action:   analyze the merged commit with the impact engine (AI layer on) and,
#           for every AFFECTED release branch, open a backport PR on THIS fork.
# Outcomes per branch (shown in a summary comment on the merged PR):
#   - clean cherry-pick  -> a normal PR is opened (never auto-merged)
#   - test-only conflict -> auto-resolved, opened as a normal PR
#   - real conflict      -> reported only; resolve locally with `backport resolve`
#
# Setup:  deploy the AWS-LC OIDC CDK stack (tests/ci/cdk) to your account so the
#         AwsLcGitHubActionsBackportOidcRole and shared AwsLcGitHubActionsBedrockRole
#         exist, set the repo/org secret AWS_ACCOUNT_ID to that account, then copy
#         this file into the fork's `.github/workflows/`. Without the role the tool
#         still runs deterministically and flags anything it cannot confirm as
#         AFFECTED (it over-flags, never misses).
#
# Safety: the tool (awslc-backport/src/main.py) refuses to target upstream
#         aws/aws-lc, so it only ever opens PRs within the fork it runs in.
name: Backport bot

on:
  pull_request:
    types: [closed, labeled]

# GITHUB_TOKEN needs to push branches and open/comment on PRs; id-token is for
# the OIDC role that grants Bedrock access to the AI layer.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  backport:
    # Only on a merged PR that carries the needs-backport label.
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'needs-backport')
    runs-on: ubuntu-latest
    env:
      # Account where the OIDC CDK stack is deployed; the shared credentials action
      # reads this to build the role ARNs. AWS_REGION must match the CDK deploy
      # region -- the Bedrock role's inference-profile ARNs are region-scoped.
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: us-west-2
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all release branches
        run: git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade anthropic boto3

      # AI layer (Amazon Bedrock). Assume the shared Bedrock role via the repo's
      # OIDC helper: the backport bot's own OIDC role is assumed from the GitHub
      # token, then chained to AwsLcGitHubActionsBedrockRole for bedrock:InvokeModel.
      # If this step is removed or the role is unavailable, the tool still runs
      # deterministically and flags anything it cannot confirm as AFFECTED.
      - name: Configure AWS credentials (Bedrock)
        uses: ./.github/actions/configure-aws-credentials
        with:
          oidcRole: AwsLcGitHubActionsBackportOidcRole
          roleName: AwsLcGitHubActionsBedrockRole

      - name: Configure git identity
        run: |
          git config user.name "aws-lc-backport-bot"
          git config user.email "backport-bot@users.noreply.github.com"

      # Analyze the merged commit and open a backport PR per AFFECTED branch,
      # then post the status table (+ machine-readable plan) on the merged PR.
      - name: Analyze and open backport PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 awslc-backport/src/main.py ci \
            --commit "${{ github.event.pull_request.merge_commit_sha }}" \
            --pr "${{ github.event.pull_request.number }}"
